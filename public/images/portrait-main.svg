<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a154b"/>
      <stop offset="40%" stop-color="#2e1035"/>
      <stop offset="80%" stop-color="#1f0a24"/>
      <stop offset="100%" stop-color="#140517"/>
    </linearGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd1dc"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#db2777" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bgGrad)"/>
  <circle cx="400" cy="450" r="320" fill="url(#halo)"/>
  
  <!-- Decorative border frame -->
  <rect x="30" y="30" width="740" height="940" rx="24" fill="none" stroke="url(#roseGold)" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6 4"/>
  <rect x="45" y="45" width="710" height="910" rx="16" fill="none" stroke="url(#roseGold)" stroke-width="0.8" stroke-opacity="0.2"/>
  
  <!-- Corner Floral Flourishes -->
  <g fill="#fb7185" opacity="0.6">
    <circle cx="60" cy="60" r="4"/>
    <circle cx="740" cy="60" r="4"/>
    <circle cx="60" cy="940" r="4"/>
    <circle cx="740" cy="940" r="4"/>
  </g>

  <!-- Central Silhouette / Aesthetic Heart Portrait -->
  <g transform="translate(400, 420)" filter="url(#glow)">
    <!-- Starbursts and sparkles -->
    <path d="M0,-160 L10,-120 L50,-120 L20,-95 L30,-55 L0,-80 L-30,-55 L-20,-95 L-50,-120 L-10,-120 Z" fill="#fbcfe8" opacity="0.25" transform="scale(0.6)"/>
    <path d="M-120,40 Q-80,20 -40,30 Q-20,70 -10,110 Q-60,110 -110,80 Z" fill="#f472b6" opacity="0.15"/>
    <path d="M120,40 Q80,20 40,30 Q20,70 10,110 Q60,110 110,80 Z" fill="#f472b6" opacity="0.15"/>
    
    <!-- Stylized Crown / Tiara -->
    <path d="M-60,-130 L-30,-155 L0,-175 L30,-155 L60,-130 L40,-120 L0,-130 L-40,-120 Z" fill="url(#roseGold)" opacity="0.85"/>
    <circle cx="0" cy="-185" r="5" fill="#fef08a"/>
    <circle cx="-30" cy="-162" r="3.5" fill="#fef08a"/>
    <circle cx="30" cy="-162" r="3.5" fill="#fef08a"/>
    
    <!-- Elegant heart art -->
    <path d="M0,-70 C-30,-120 -110,-110 -110,-40 C-110,35 0,110 0,125 C0,110 110,35 110,-40 C110,-110 30,-120 0,-70 Z" fill="none" stroke="url(#roseGold)" stroke-width="2.5" opacity="0.8"/>
    <path d="M0,-60 C-25,-100 -90,-90 -90,-35 C-90,25 0,90 0,105 C0,90 90,25 90,-35 C90,-90 25,-100 0,-60 Z" fill="url(#roseGold)" opacity="0.12"/>
  </g>

  <!-- Romantic Sparkles -->
  <g fill="#fed7aa" opacity="0.8">
    <polygon points="220,240 223,248 231,251 223,254 220,262 217,254 209,251 217,248"/>
    <polygon points="580,220 582,226 588,228 582,230 580,236 578,230 572,228 578,226"/>
    <polygon points="620,580 623,588 631,591 623,594 620,602 617,594 609,591 617,588"/>
    <polygon points="180,620 182,626 188,628 182,630 180,636 178,630 172,628 178,626"/>
  </g>

  <!-- Typography overlay / replacement placeholder note -->
  <g text-anchor="middle" font-family="'Playfair Display', Georgia, serif">
    <text x="400" y="690" fill="#ffffff" font-size="34" font-weight="600" letter-spacing="2">Her Radiant Self</text>
    <text x="400" y="730" fill="#f472b6" font-size="20" font-style="italic" font-family="'Dancing Script', cursive, Georgia">The brightest light in every room ♡</text>
    
    <rect x="180" y="790" width="440" height="60" rx="30" fill="#ffffff" fill-opacity="0.08" stroke="#f472b6" stroke-opacity="0.3" stroke-width="1"/>
    <text x="400" y="826" fill="#fce7f3" font-size="14" font-family="sans-serif" letter-spacing="1" opacity="0.85">✦ Put her favorite photo here (public/images/portrait-main.jpg) ✦</text>
  </g>
</svg>